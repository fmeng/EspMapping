[platformio]
default_envs = wemos_d1_mini32
;default_envs = lolin_s2_mini
;default_envs = lolin_c3_mini
;default_envs = lolin_s3_mini
;default_envs = d1_mini
;default_envs = d1_mini_pro
;default_envs = esp07s
;default_envs = esp01_1m

[env]
my_lib_base_path = /Users/fmeng/my_platformio_lib
extra_script_main = ${env.my_lib_base_path}/extra_script_main.py
extra_scripts =
    pre:${env.extra_script_main}

main_file = examples/EspMapping/EspMapping.ino

build_flags = -w

monitor_speed = 115200
;upload_speed = 115200
upload_speed = 921600
;upload_speed = 1500000
;upload_speed = 2000000

[env:wemos_d1_mini32]
platform = espressif32
board = wemos_d1_mini32
framework = arduino

[env:esp01_1m]
platform = espressif8266
board = esp01_1m
framework = arduino
upload_resetmethod = nodemcu

[env:lolin_s2_mini]
platform = espressif32
board = lolin_s2_mini
framework = arduino
build_flags =
    -D CONFIG_USB_CDC_ENABLED=y

[env:lolin_c3_mini]
platform = espressif32
board = lolin_c3_mini
framework = arduino
build_unflags =
    -D ARDUINO_USB_MODE
    -D ARDUINO_USB_CDC_ON_BOOT

[env:lolin_s3_mini]
platform = espressif32
board = lolin_s3_mini
framework = arduino
monitor_speed = 115200
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1

[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino

[env:d1_mini_pro]
; 16M的flash使用这个配置, 不要在意board的配置
platform = espressif8266
board = d1_mini_pro
framework = arduino

[env:esp07s]
platform = espressif8266
board = esp07s
framework = arduino